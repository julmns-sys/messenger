<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Group Chat | Messenger</title>
    <link rel="stylesheet" href="assets/css/styles.css">
  </head>
  <body class="page-shell thread-page" data-chat-type="group">
    <main class="app">
      <aside class="sidebar">
        <div class="sidebar-header">
          <div>
            <div class="brand">Messenger</div>
            <div class="muted" id="currentUserBadge"></div>
          </div>
          <div class="sidebar-actions">
            <a class="icon-button" href="search.html" aria-label="Search">@</a>
            <a class="icon-button" href="create_group.html" aria-label="Create group">+</a>
            <button class="icon-button" id="logoutButton" type="button" aria-label="Logout">×</button>
          </div>
        </div>
        <div class="sidebar-search">
          <input class="search-input" type="text" placeholder="Группы и чаты" disabled>
        </div>
        <div class="chat-list" id="chatList"></div>
      </aside>

      <section class="content">
        <header class="content-header">
          <div class="thread-header">
            <div class="thread-header-side">
              <a class="icon-button thread-back" href="index.html" aria-label="Back">←</a>
            </div>
            <div class="thread-header-main">
              <h1 class="chat-name" id="chatTitle">Группа</h1>
              <p class="muted" id="chatSubtitle">Загрузка...</p>
            </div>
            <div class="thread-header-side">
              <div class="avatar header-avatar" id="chatAvatar">?</div>
            </div>
          </div>
        </header>
        <div class="content-body">
          <div class="messages" id="messages"></div>
          <div class="composer-wrap">
            <form class="composer" id="messageForm">
              <textarea class="textarea" id="messageInput" placeholder="Сообщение в группу..." required></textarea>
              <button class="send-button" type="submit">➤</button>
            </form>
            <div id="messageStatus" class="status thread-status"></div>
          </div>
        </div>
      </section>
    </main>
    <script src="assets/js/api.js"></script>
    <script src="assets/js/common.js"></script>
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <script src="assets/js/chat.js"></script>
  </body>
</html>
