<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }}</title>
    <link rel="icon" type="image/svg+xml" href="/assets/icons/app/favicon.svg">
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/icons/app/favicon32x32.png">
    <link rel="apple-touch-icon" href="/assets/icons/app/favicon32x32.png">
    <link rel="stylesheet" href="/assets/css/styles.css">
  </head>
  <body class="{{ body_class }}"{% if data_chat_type %} data-chat-type="{{ data_chat_type }}"{% endif %}>
    <main class="app">
      {% include "partials/sidebar.html" %}
      {% block content %}{% endblock %}
    </main>
    <script src="/assets/js/api.js"></script>
    <script src="/assets/js/common.js"></script>
    {% block shared_scripts %}{% endblock %}
    {% block page_scripts %}{% endblock %}
  </body>
</html>
