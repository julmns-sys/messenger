<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>/Chatik</title>
    <link rel="stylesheet" href="assets/css/styles.css">
  </head>
  <body class="page-shell chats-page">
    <main class="app">
      <aside class="sidebar">
        <div class="sidebar-slider">
          <div class="sidebar-panel sidebar-panel-main">
            <div class="sidebar-header">
              <div>
                <div class="brand">/Chatik</div>
                <button class="current-user-badge" id="currentUserBadge" type="button" aria-label="Открыть профиль"></button>
              </div>
              <div class="sidebar-actions">
                <a class="icon-button" href="search.html" aria-label="Search">@</a>
                <a class="icon-button" href="create_group.html" aria-label="Create group">+</a>
                <button class="icon-button" id="logoutButton" type="button" aria-label="Logout">×</button>
              </div>
            </div>
            <div class="sidebar-search">
              <input class="search-input" type="text" placeholder="Ваши чаты">
            </div>
            <div class="chat-list" id="chatList"></div>
          </div>

          <div class="sidebar-panel sidebar-panel-profile" aria-hidden="true">
            <div class="sidebar-header">
              <div class="sidebar-profile-title">
                <button class="icon-button page-back" id="sidebarProfileBack" type="button" aria-label="Назад"></button>
                <div>
                  <div class="brand">Профиль</div>
                  <div class="muted">Ваши данные</div>
                </div>
              </div>
            </div>
            <div class="sidebar-profile-body">
              <div class="sidebar-profile-card">
                <div class="avatar sidebar-profile-avatar" id="sidebarProfileAvatar">?</div>
                <h2 class="sidebar-profile-name" id="sidebarProfileName">Пользователь</h2>
                <p class="sidebar-profile-username" id="sidebarProfileUsername">@username</p>
                <button class="sidebar-profile-mode-toggle" id="sidebarProfileEditToggle" type="button">Изменить</button>
                <div class="sidebar-profile-facts">
                  <div class="sidebar-profile-fact">
                    <span class="sidebar-profile-label">Имя</span>
                    <div class="sidebar-profile-line">
                      <strong id="sidebarProfileNameField">Не указано</strong>
                      <button class="sidebar-profile-edit" type="button" data-profile-edit="name" aria-label="Изменить имя">✎</button>
                    </div>
                  </div>
                  <div class="sidebar-profile-fact">
                    <span class="sidebar-profile-label">Email</span>
                    <div class="sidebar-profile-line">
                      <button class="sidebar-profile-secret is-blurred" id="sidebarProfileEmail" type="button" aria-label="Показать email" aria-pressed="false">Не указана</button>
                      <button class="sidebar-profile-edit" type="button" data-profile-edit="email" aria-label="Изменить email">✎</button>
                    </div>
                  </div>
                  <div class="sidebar-profile-fact">
                    <span class="sidebar-profile-label">Username</span>
                    <div class="sidebar-profile-line">
                      <strong id="sidebarProfileHandle">@username</strong>
                      <button class="sidebar-profile-edit" type="button" data-profile-edit="username" aria-label="Изменить username">✎</button>
                    </div>
                  </div>
                  <div class="sidebar-profile-fact">
                    <span class="sidebar-profile-label">Bio</span>
                    <div class="sidebar-profile-line">
                      <strong id="sidebarProfileBio">Не указана</strong>
                      <button class="sidebar-profile-edit" type="button" data-profile-edit="bio" aria-label="Изменить bio">✎</button>
                    </div>
                  </div>
                  <div class="sidebar-profile-fact">
                    <span class="sidebar-profile-label">ID</span>
                    <div class="sidebar-profile-line">
                      <strong id="sidebarProfileId">-</strong>
                    </div>
                  </div>
                </div>
              </div>

              <div class="sidebar-profile-actions">
                <div class="sidebar-profile-actions-header">
                  <h3>Настройки</h3>
                  <p class="muted">Кнопки добавим следующим шагом.</p>
                </div>
              </div>
            </div>
          </div>
        </div>
      </aside>

      <section class="content">
        <header class="content-header">
          <div>
            <h1 class="chat-name">Все чаты</h1>
            <p class="muted">Выберите диалог слева или найдите пользователя по username.</p>
          </div>
          <div class="header-actions">
            <a class="icon-button mobile-only" href="search.html" aria-label="Search">@</a>
            <a class="icon-button mobile-only" href="create_group.html" aria-label="Create group">+</a>
          </div>
        </header>
        <div class="content-body">
          <div class="placeholder">
            <div>
              <h2 class="page-title">Добро пожаловать</h2>
              <p class="page-subtitle">Выберите чат для начала общения</p>
            </div>
          </div>
        </div>
      </section>
    </main>
    <script src="assets/js/api.js"></script>
    <script src="assets/js/common.js"></script>
    <script src="assets/js/index.js"></script>
  </body>
</html>
