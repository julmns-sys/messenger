<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | /Chatik</title>
    <link rel="stylesheet" href="assets/css/styles.css">
  </head>
  <body class="auth-page">
    <main class="auth-card">
      <h1>Вход</h1>
      <p>Общайся в realtime</p>
      <form data-auth="login">
        <div class="form-group">
          <label class="label" for="username">Username</label>
          <input class="input" id="username" name="username" type="text" placeholder="@username" required>
        </div>
        <div class="form-group">
          <label class="label" for="password">Пароль</label>
          <input class="input" id="password" name="password" type="password" placeholder="Введите пароль" required>
        </div>
        <button class="button" type="submit">Войти</button>
        <div id="status" class="status"></div>
      </form>
      <p class="auth-footer">Нет аккаунта? <a href="register.html">Зарегистрироваться</a></p>
    </main>
    <script src="assets/js/api.js"></script>
    <script src="assets/js/auth.js"></script>
  </body>
</html>
