<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | /Chatik</title>
    <link rel="icon" type="image/svg+xml" href="/assets/icons/app/favicon.svg">
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/icons/app/favicon32x32.png">
    <link rel="apple-touch-icon" href="/assets/icons/app/favicon32x32.png">
    <link rel="stylesheet" href="/assets/css/styles.css">
  </head>
  <body class="auth-page">
    <main class="auth-card">
      <h1>Вход</h1>
      <p>Общайся в realtime в /Chatik'e</p>
      <form data-auth="login">
        <div class="form-group">
          <label class="label" for="username">Username</label>
          <input class="input" id="username" name="username" type="text" placeholder="@username" required>
        </div>
        <div class="form-group">
          <label class="label" for="password">Пароль</label>
          <input class="input" id="password" name="password" type="password" placeholder="Введите пароль" required>
        </div>
        <button class="button" type="submit">Войти</button>
        <div id="status" class="status"></div>
      </form>
      <section class="auth-secondary-card">
        <div class="auth-secondary-head">
          <h2>Восстановление пароля</h2>
          <p>Введите email, получите код и задайте новый пароль.</p>
        </div>
        <form data-password-reset-form="true">
          <div class="form-group">
            <label class="label" for="reset-email">Email</label>
            <input class="input" id="reset-email" name="email" type="email" placeholder="you@example.com" required>
          </div>
          <div class="form-group verify-code-group">
            <div class="verify-code-header">
              <label class="label" for="reset-code-0">Код подтверждения</label>
              <span class="verify-code-hint">6 цифр</span>
            </div>
            <input id="reset-code" name="code" type="hidden" required>
            <div class="verify-code-grid" data-verify-code-inputs>
              <input class="verify-code-cell" id="reset-code-0" type="text" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]*" maxlength="1" aria-label="Цифра 1" data-code-index="0">
              <input class="verify-code-cell" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" aria-label="Цифра 2" data-code-index="1">
              <input class="verify-code-cell" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" aria-label="Цифра 3" data-code-index="2">
              <input class="verify-code-cell" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" aria-label="Цифра 4" data-code-index="3">
              <input class="verify-code-cell" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" aria-label="Цифра 5" data-code-index="4">
              <input class="verify-code-cell" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" aria-label="Цифра 6" data-code-index="5">
            </div>
          </div>
          <div class="form-group">
            <label class="label" for="reset-password">Новый пароль</label>
            <input class="input" id="reset-password" name="password" type="password" placeholder="Минимум 6 символов" required>
          </div>
          <div class="auth-secondary-actions">
            <button class="button button-secondary" type="button" data-password-reset-request="true">Получить код</button>
            <button class="button" type="submit">Сменить пароль</button>
          </div>
          <div id="passwordResetStatus" class="status"></div>
        </form>
      </section>
      <p class="auth-footer">Нет аккаунта? <a href="/register">Зарегистрироваться</a></p>
    </main>
    <script src="/assets/js/api.js"></script>
    <script src="/assets/js/auth.js"></script>
  </body>
</html>
